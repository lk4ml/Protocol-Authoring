# Render Blueprint — ProtoHelix Backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: protohelix-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: ENV
        value: production
      - key: PORT
        value: "8001"
      - key: NEO4J_URI
        sync: false   # Set manually in Render dashboard
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false   # Set to your Vercel domain
      - key: CDISC_API_KEY
        sync: false
    healthCheckPath: /api/health
